# Cài hook: pre-commit install
# Chạy tay toàn bộ: pre-commit run --all-files
#
# Hook chặn được: secret bị commit, file quá lớn, conflict marker,
# line ending lộn xộn, code chưa format, code có lỗi lint cơ bản.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: \.(bat|cmd|ps1|iss)$
      # Hàng rào phía máy: chặn commit trực tiếp lên nhánh tích hợp.
      # Cần thiết vì repo private + tài khoản free chưa bật được branch
      # protection (xem docs/setup-github.md mục 4b). Khi đã có protection
      # hoặc GitHub Pro, hook này chỉ còn là lớp bảo hiểm thứ hai.
      # Ngoại lệ hợp lệ duy nhất: merge phát hành -> dùng `git commit --no-verify`
      # và ghi rõ lý do trong PR.
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "develop"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # Chặn commit file .env thật (chỉ cho .env.example)
  - repo: local
    hooks:
      - id: forbid-env-file
        name: Không commit file .env
        entry: File .env không được commit. Chỉ commit .env.example.
        language: fail
        files: '(^|/)\.env$'
