name: Release

# Đóng gói bộ cài Windows — BẮT BUỘC theo đề bài.
# Build trên windows-latest để thành viên dùng macOS/Linux vẫn ra được .exe
# mà không cần máy Windows hay máy ảo.
#
# Kích hoạt:
#   - push tag v*        -> build + đính .exe vào GitHub Release
#   - workflow_dispatch  -> build + tải .exe ở mục Artifacts (để test G1)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build bộ cài (.exe)
    runs-on: windows-latest
    # PyInstaller + Inno Setup bình thường ~6–10 phút; treo quá 45 phút là bất thường.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Kiểm tra đã có cấu hình đóng gói chưa
        id: probe
        shell: bash
        run: |
          if ls installer/*.iss >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Chưa sẵn sàng (bỏ qua)
        if: steps.probe.outputs.ready != 'true'
        shell: bash
        run: |
          echo "::notice title=Chưa có installer/*.iss::Pipeline đóng gói sẽ bật khi có file .iss. Bỏ qua."

      - uses: actions/setup-python@v7
        if: steps.probe.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài thư viện + PyInstaller
        if: steps.probe.outputs.ready == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build GUI + bộ cài (PyInstaller → Inno Setup)
        if: steps.probe.outputs.ready == 'true'
        shell: bash
        run: bash scripts/build_installer.sh
        env:
          ISCC: "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"

      - name: Kiểm tra file cài tồn tại
        if: steps.probe.outputs.ready == 'true'
        shell: bash
        run: |
          ls -lh dist/CafeTLU/CafeTLU.exe installer/Output/*.exe

      - name: Lưu bản cài để tải về (mọi lần chạy)
        if: steps.probe.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CafeTLU-Setup
          path: installer/Output/*.exe
          retention-days: 14

      - name: Đính vào GitHub Release (chỉ khi push tag)
        if: steps.probe.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
