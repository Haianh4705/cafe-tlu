name: Release

# Đóng gói bộ cài Windows — BẮT BUỘC theo đề bài.
# Build trên windows-latest để thành viên dùng macOS/Linux vẫn ra được .exe
# mà không cần máy Windows hay máy ảo.
#
# Kích hoạt:
#   - push tag v*        -> build + đính .exe vào GitHub Release
#   - workflow_dispatch  -> build + tải .exe ở mục Artifacts (để test G1)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build bộ cài (.exe)
    runs-on: windows-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    # PyInstaller + Inno Setup bình thường ~6–10 phút; treo quá 45 phút là bất thường.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Kiểm tra đã có cấu hình đóng gói chưa
        id: probe
        shell: bash
        run: |
          if ls installer/*.iss >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Chưa sẵn sàng (bỏ qua)
        if: steps.probe.outputs.ready != 'true'
        shell: bash
        run: |
          echo "::notice title=Chưa có installer/*.iss::Pipeline đóng gói sẽ bật khi có file .iss. Bỏ qua."

      - uses: actions/setup-python@v7
        if: steps.probe.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài thư viện + PyInstaller
        if: steps.probe.outputs.ready == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build GUI + bộ cài (PyInstaller → Inno Setup)
        if: steps.probe.outputs.ready == 'true'
        shell: bash
        run: bash scripts/build_installer.sh
        env:
          ISCC: "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"

      - name: Kiểm tra file cài tồn tại
        if: steps.probe.outputs.ready == 'true'
        shell: bash
        run: |
          ls -lh dist/CafeTLU/CafeTLU.exe installer/Output/*.exe

      - name: Lưu bản cài để tải về (mọi lần chạy)
        if: steps.probe.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CafeTLU-Setup
          path: installer/Output/*.exe
          retention-days: 14

      - name: Đính vào GitHub Release (chỉ khi push tag)
        if: steps.probe.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

  verify-installer:
    name: Cài thử trên Windows sạch
    # Máy ảo Windows mới mỗi lần chạy = "máy sạch": không có Python, PySide6 hay
    # bản cài cũ từ máy lập trình viên. Đây là bằng chứng cho cổng G1.
    needs: build-installer
    if: needs.build-installer.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Tải bộ cài vừa build
        uses: actions/download-artifact@v4
        with:
          name: CafeTLU-Setup
          path: installer-download

      - name: Cài im lặng, chạy thử, chụp ảnh, gỡ cài
        shell: pwsh
        run: |
          ./scripts/verify_installer.ps1 `
            -InstallerPath installer-download `
            -InstallDir "C:\CafeTLU-verify" `
            -ScreenshotPath "verification/gui.png" `
            -ReportPath "verification/report.md"

      - name: Đưa báo cáo vào phần tóm tắt của lần chạy
        if: always()
        shell: bash
        run: |
          if [ -f verification/report.md ]; then
            cat verification/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Không có verification/report.md — bước cài thử hỏng trước khi ghi báo cáo." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lưu ảnh chụp + báo cáo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-verification-windows
          path: verification/
          retention-days: 30
          if-no-files-found: warn
